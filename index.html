<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- Primary Meta Tags -->
    <title>NOVA Dashboard | The Ultimate E-Commerce Admin Panel</title>
    <meta name="title" content="NOVA Dashboard | The Ultimate E-Commerce Admin Panel" />
    <meta name="description" content="The most advanced e-commerce dashboard with AI, gestures, and 3D visualizations. Manage products, orders, customers, and analytics in real-time." />
    <meta name="keywords" content="dashboard, admin, ecommerce, react, typescript, tailwind, ai, gestures, 3d" />
    <meta name="author" content="NOVA" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://novadashboard.com" />
    <meta property="og:title" content="NOVA Dashboard | The Ultimate E-Commerce Admin Panel" />
    <meta property="og:description" content="The most advanced e-commerce dashboard with AI, gestures, and 3D visualizations." />
    <meta property="og:image" content="https://novadashboard.com/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://novadashboard.com" />
    <meta property="twitter:title" content="NOVA Dashboard | The Ultimate E-Commerce Admin Panel" />
    <meta property="twitter:description" content="The most advanced e-commerce dashboard with AI, gestures, and 3D visualizations." />
    <meta property="twitter:image" content="https://novadashboard.com/og-image.jpg" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    <link rel="preload" href="/src/styles/index.css" as="style" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Scripts -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
    
    <!-- Analytics (optional) -->
    <script defer data-domain="novadashboard.com" src="https://plausible.io/js/script.js"></script>
  </body>
</html>
